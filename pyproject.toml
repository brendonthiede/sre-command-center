[project]
name = "sre-command-center"
version = "0.1.0"
description = "Local dashboard for the feeds I monitor every day"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "requests>=2.32",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
scc = "scc.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scc"]
